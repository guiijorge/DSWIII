<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário - Dados Pessoais</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="form-box">
    <h1>Informe seus dados</h1>

    <form th:action="@{/salvar-pessoa}" method="post" th:object="${pessoa}">

        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" required>
        </div>

        <div class="form-group">
            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento" th:field="*{dataNascimento}" required>
        </div>

        <div class="form-group">
            <label for="altura">Altura:</label>
            <input type="number" id="altura" th:field="*{altura}" placeholder="Ex: 175" class="input-pequeno" step="1" min="0" required>
        </div>

        <button type="submit">Enviar</button>
    </form>
</div>
</body>
</html>
